<main>

  <section class="cards-padrao">
    @if (carregandoCards) {
      <p-skeleton height="110px" />
      <p-skeleton height="110px" />
      <p-skeleton height="110px" />
      <p-skeleton height="110px" />
    } @else {
      <app-card-resumo
        titulo="Receita do Mês"
        icone="fa fa-sack-dollar"
        variante="primario"
        [valor]="cards.receitaMesAtual | currency: 'BRL'"
        [descricao]="textoVariacaoMes"
        [tomDescricao]="tomVariacaoMes"
      />
      <app-card-resumo
        titulo="Receita de Hoje"
        icone="fa fa-credit-card"
        variante="sucesso"
        [valor]="cards.receitaHoje | currency: 'BRL'"
        [descricao]="textoVariacaoHoje"
        [tomDescricao]="tomVariacaoHoje"
      />
      <app-card-resumo
        titulo="Pagamentos Pendentes"
        icone="fa fa-clock"
        variante="pendente"
        [valor]="cards.valorPendente | currency: 'BRL'"
        [descricao]="cards.quantidadePendentes + ' fatura(s) a receber'"
      />
      <app-card-resumo
        titulo="Em Atraso"
        icone="fa fa-triangle-exclamation"
        variante="perigo"
        [valor]="cards.valorEmAtraso | currency: 'BRL'"
        [descricao]="cards.quantidadeEmAtraso + ' fatura(s) vencida(s)'"
      />
    }
  </section>

  <section class="painel-grafico">
    <p-fieldset legend="Visão Geral da Receita" [toggleable]="false">
      <ng-template pTemplate="header">
        <div class="header-grafico">
          <div class="alternar-agrupamento">
            <button
              type="button"
              class="opcao"
              [class.ativo]="!exibirGraficoMensal"
              (click)="alternarAgrupamentoGrafico(false)"
            >
              Diário
            </button>
            <button
              type="button"
              class="opcao"
              [class.ativo]="exibirGraficoMensal"
              (click)="alternarAgrupamentoGrafico(true)"
            >
              Mensal
            </button>
          </div>
        </div>
      </ng-template>
      @if (carregandoGrafico) {
        <p-skeleton height="320px" />
      } @else {
        <p-chart
          type="line"
          [data]="grafico"
          [options]="opcoesGrafico"
          height="320px"
        ></p-chart>
      }
    </p-fieldset>
  </section>

  <section class="painel-faturas">
    <p-fieldset legend="Filtros" [toggleable]="false">
      <div class="filtros">
        <div class="inputs">
          <div class="input-group busca">
            <label for="busca">Buscar</label>
            <input
              type="text"
              pInputText
              [(ngModel)]="filtros.busca"
              id="busca"
              placeholder="Cliente ou número da fatura"
              (input)="filtrarFaturas()"
            />
          </div>
          <div class="input-group">
            <label for="status">Status</label>
            <p-select
              appendTo="body"
              [(ngModel)]="filtros.status"
              placeholder="Status"
              [options]="opcoesStatusFatura"
              optionLabel="label"
              optionValue="value"
              (onChange)="filtrarFaturas()"
            ></p-select>
          </div>
          <div class="input-group">
            <label for="tipoPagamento">Forma de Pagamento</label>
            <p-select
              appendTo="body"
              [(ngModel)]="filtros.tipoPagamento"
              placeholder="Forma de Pagamento"
              [options]="opcoesTipoPagamento"
              optionLabel="label"
              optionValue="value"
              (onChange)="filtrarFaturas()"
            ></p-select>
          </div>
          <div class="input-group">
            <label for="dataInicio">Data Início</label>
            <p-datepicker
              [(ngModel)]="filtros.dataInicio"
              id="dataInicio"
              placeholder="Data Início"
              dateFormat="dd/mm/yy"
              appendTo="body"
              [showIcon]="true"
              (onSelect)="filtrarFaturas()"
              (onClear)="filtrarFaturas()"
              [showClear]="true"
            ></p-datepicker>
          </div>
          <div class="input-group">
            <label for="dataFim">Data Fim</label>
            <p-datepicker
              [(ngModel)]="filtros.dataFim"
              id="dataFim"
              placeholder="Data Fim"
              dateFormat="dd/mm/yy"
              appendTo="body"
              [showIcon]="true"
              (onSelect)="filtrarFaturas()"
              (onClear)="filtrarFaturas()"
              [showClear]="true"
            ></p-datepicker>
          </div>
        </div>
        <div class="btns">
          <p-button
            label="Limpar Filtros"
            icon="fa fa-eraser"
            (click)="limparFiltros()"
            severity="danger"
          />
          <p-button
            label="Exportar"
            icon="fa fa-file-export"
            (click)="gerarRelatorio()"
            severity="success"
          />
        </div>
      </div>
    </p-fieldset>

    <p-fieldset legend="Faturas Recentes" [toggleable]="false">
      <p-table
        [value]="faturasFiltradas"
        [loading]="carregandoFaturas"
        [paginator]="true"
        [rows]="5"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="Exibindo {first} de {last} de {totalRecords} registros"
        [rowsPerPageOptions]="[5, 10, 20]"
        [stripedRows]="true"
      >
        <ng-template pTemplate="header">
          <tr>
            <th>Fatura</th>
            <th>Cliente</th>
            <th pSortableColumn="valor">
              <p-sortIcon field="valor"></p-sortIcon> Valor
            </th>
            <th>Status</th>
            <th pSortableColumn="data">
              <p-sortIcon field="data"></p-sortIcon> Data
            </th>
            <th>Forma de Pagamento</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-fatura>
          <tr>
            <td>{{ fatura.numero }}</td>
            <td>{{ fatura.clienteNome }}</td>
            <td>{{ fatura.valor | currency: "BRL" }}</td>
            <td>
              <app-bag-status-pagamento [status]="fatura.status"></app-bag-status-pagamento>
            </td>
            <td>{{ fatura.data | date: "dd/MM/yyyy HH:mm" }}</td>
            <td>
              <app-bag-forma-pagamento [tipo]="fatura.tipoPagamento"></app-bag-forma-pagamento>
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="6">
              <span class="sem-resultados">Nenhuma fatura encontrada!</span>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </p-fieldset>
  </section>
</main>
